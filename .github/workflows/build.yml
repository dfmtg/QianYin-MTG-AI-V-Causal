name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pyinstaller --onefile --name "QianYin-MTG-AI-V-Causal-Windows" "MTG AI V-Causal.py"
          echo "BUILD_PLATFORM=windows" >> $GITHUB_ENV

      - name: Build on macOS (Intel/ARM)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Detect chip architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            # M-series chips: use arm64 architecture
            pyinstaller --onefile --name "QianYin-MTG-AI-V-Causal-macOS-ARM64" "MTG AI V-Causal.py"
          else
            # Intel chips: use x86_64 architecture
            pyinstaller --onefile --name "QianYin-MTG-AI-V-Causal-macOS-Intel" "MTG AI V-Causal.py"
          fi
          echo "BUILD_PLATFORM=macos" >> $GITHUB_ENV

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pyinstaller --onefile --name "QianYin-MTG-AI-V-Causal-Linux" "MTG AI V-Causal.py"
          echo "BUILD_PLATFORM=linux" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/**/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## QianYin MTG AI V-Causal v${{ github.ref_name }}

            ### Build Artifacts
            - Windows: QianYin-MTG-AI-V-Causal-Windows.exe
            - macOS (Intel): QianYin-MTG-AI-V-Causal-macOS-Intel
            - macOS (ARM): QianYin-MTG-AI-V-Causal-macOS-ARM64
            - Linux: QianYin-MTG-AI-V-Causal-Linux

            ### Features
            - Serial causal inference architecture (non-Transformer)
            - CPU-efficient, no GPU required
            - Real-time learning during conversations
            - IPv4/IPv6 dual-stack support
            - Web admin interface (port 8080)
            - OpenAI compatible API
            - Human feedback training system
            - LZ4 compression support
            - Snapshot system for fast recovery

            ### Installation
            ```bash
            pip install lz4 psutil
            python "MTG AI V-Causal.py"
            ```
